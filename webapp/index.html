<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Center Analytics Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<header class="mobile-bar" id="mobile_bar">
  <button id="menu_toggle" class="menu-toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false">
    <span class="menu-icon" aria-hidden="true">☰</span>
  </button>
  <span class="mobile-brand">Data Center Analytics</span>
</header>
<div id="drawer_backdrop" class="drawer-backdrop" aria-hidden="true"></div>
<div class="app">
  <aside class="side" id="sidebar" aria-label="Menu">
    <div class="side-header">
      <div>
        <p class="brand">Data Center<br>Analytics Studio</p>
        <p class="brand-sub">data_center_hybrid.csv · every analysis in one place</p>
      </div>
      <button id="menu_close" class="menu-close-btn" type="button" aria-label="Close navigation menu">&times;</button>
    </div>
    <div class="chips" id="tool_chips" role="group" aria-label="Choose a tool"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<div id="tip" role="tooltip"></div>

<!-- load order matters: library, data, then page files, start.js last -->
<script src="lib/chart.umd.js"></script>
<script src="data/data.js"></script>
<script src="js/core.js"></script>
<script src="js/home.js"></script>
<script src="js/understand.js"></script>
<script src="js/stats.js"></script>
<script src="js/kpi.js"></script>
<script src="js/cluster.js"></script>
<script src="js/regress.js"></script>
<script src="js/knime.js"></script>
<script src="js/prep.js"></script>
<script src="js/apps.js"></script>
<script src="js/start.js"></script>
</body>
</html>
